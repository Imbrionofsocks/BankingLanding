<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ошибка 404 - Страница не найдена | Банкротный Юрист</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .error-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f7f5ef;
            text-align: center;
            padding: 20px;
        }
        .error-title {
            font-size: 8rem;
            color: #224745;
            margin: 0;
            line-height: 1;
        }
        .error-subtitle {
            font-size: 2rem;
            color: #BFAD80;
            margin-bottom: 20px;
        }
        .error-text {
            font-size: 1.2rem;
            color: #333;
            max-width: 600px;
            margin-bottom: 40px;
        }
        .red-btn-header {
            display: inline-block;
            text-decoration: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="error-page">
        <h1 class="error-title">404</h1>
        <h2 class="error-subtitle">Страница не найдена</h2>
        <p class="error-text">Похоже, вы перешли по устаревшей или неправильной ссылке. Но не переживайте, ваши финансы всё ещё можно спасти!</p>
        <a href="/" class="red-btn-header">Вернуться на главную</a>
    </div>
</body>
</html>
